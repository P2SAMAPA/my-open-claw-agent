name: Run AI Agent (Manual Only)

on:
  workflow_dispatch:
    inputs:
      goal:
        description: 'What should the agent do?'
        required: false
        default: 'Research the latest developments in AI and provide a 3-point summary.'
      model:
        description: 'OpenRouter Model to use'
        required: false
        default: 'nvidia/nemotron-3-ultra-550b-a55b:free'
        type: choice
        options:
          - 'nvidia/nemotron-3-ultra-550b-a55b:free'
          - 'nvidia/nemotron-3-super-120b-a12b:free'
          - 'cohere/north-mini-code:free'
          - 'openrouter/free'

jobs:
  agent-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ github.event.inputs.model || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}
          AGENT_GOAL: ${{ github.event.inputs.goal || 'Research the latest developments in AI and provide a 3-point summary.' }}
        run: |
          echo "🤖 Starting OpenClaw 2.0 agent..."
          echo "📋 Goal: $AGENT_GOAL"
          echo "🧠 Model: $OPENROUTER_MODEL"
          echo ""
          node agent.js | tee output.txt
          echo "📊 Agent output:" > result.md
          echo '```' >> result.md
          cat output.txt >> result.md
          echo '```' >> result.md

      - name: Save results
        uses: actions/upload-artifact@v4
        with:
          name: agent-results-${{ github.run_id }}
          path: result.md
          retention-days: 7

      - name: Create Issue with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('result.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            const goal = process.env.AGENT_GOAL || 'No goal specified';
            const model = process.env.OPENROUTER_MODEL || 'default';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 OpenClaw 2.0 Report - ${date}`,
              body: `## 🤖 OpenClaw 2.0 Report - ${date}\n\n**Goal:** ${goal}\n\n**Model:** ${model}\n\n### Results\n\n${result}`
            });
